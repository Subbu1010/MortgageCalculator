apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-mcp-server
  labels:
    app: mortgage-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mortgage-mcp-server
  template:
    metadata:
      labels:
        app: mortgage-mcp-server
    spec:
      serviceAccountName: mortgage-mcp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: server
          image: image-registry.openshift-image-registry.svc:5000/your-namespace/mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: mortgage-mcp-server-config
                optional: true
            - secretRef:
                name: mortgage-mcp-server-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mortgage-mcp-server
