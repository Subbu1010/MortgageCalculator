apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-server.fullname" . }}-env
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
data:
  APP_NAME: mortgage-mcp-server
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HOST: "0.0.0.0"
  PORT: "{{ .Values.service.port }}"
  DATABASE_HOST: {{ .Values.database.host | quote }}
  DATABASE_PORT: {{ .Values.database.port | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  DATABASE_USER: {{ .Values.database.user | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  EMBEDDING_DIMENSIONS: "{{ .Values.config.embeddingDimensions }}"
  CHUNK_SIZE: "{{ .Values.config.chunkSize }}"
  CHUNK_OVERLAP: "{{ .Values.config.chunkOverlap }}"
  RAG_TOP_K: "{{ .Values.config.ragTopK }}"
  RAG_SIMILARITY_THRESHOLD: "{{ printf "%f" .Values.config.ragSimilarityThreshold }}"
  DOCUMENTS_PATH: {{ .Values.config.documentsPath | quote }}
  SKIP_STARTUP_INGEST: {{ .Values.config.skipStartupIngest | quote }}
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  RUN_ALEMBIC_ON_STARTUP: "true"
