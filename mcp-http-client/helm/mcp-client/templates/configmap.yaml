apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-client.fullname" . }}-env
  labels:
    {{- include "mcp-client.labels" . | nindent 4 }}
data:
  MCP_SERVER_BASE_URL: {{ .Values.config.serverBaseUrl | quote }}
  REQUEST_TIMEOUT_SECONDS: {{ .Values.config.requestTimeoutSeconds | quote }}
