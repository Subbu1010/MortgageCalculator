{{- if and .Values.route.enabled .Values.service.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "mcp-client.fullname" . }}
  labels:
    {{- include "mcp-client.labels" . | nindent 4 }}
spec:
  host: {{ required "route.host when route enabled" .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "mcp-client.fullname" . }}
    weight: 100
  port:
    targetPort: http
{{- end }}
