services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mortgage-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mortgage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mortgage"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mortgage-mcp-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: mortgage
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      DOCUMENTS_PATH: /data/documents
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./sample-documents:/data/documents:ro

  mcp-client:
    build:
      context: ../mcp-http-client
      dockerfile: Dockerfile
    container_name: mortgage-mcp-client
    depends_on:
      - mcp-server
    environment:
      MCP_SERVER_BASE_URL: http://mcp-server:8000
    profiles:
      - client

volumes:
  pgdata:
