apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-server.fullname" . }}-secret
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
  {{- if .Values.secrets.googleApiKey }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  {{- else }}
  GOOGLE_API_KEY: ""
  {{- end }}
